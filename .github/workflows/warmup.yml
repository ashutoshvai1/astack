name: Start Claude usage window
on:
  schedule:
    - cron: "45 6 * * *"   # 06:45 UTC = 08:45 Helsinki in winter (07:45 in summer)
  workflow_dispatch:        # lets you trigger it manually to test
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude -p "Reply with just: good morning" --model haiku --max-turns 1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
